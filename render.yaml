services:
  - type: web
    name: zygy-voice-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install cors express
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1"
      - key: VOICE
        value: "Fenrir"
      - key: TURN_BUDGET_MS
        value: "120000"
      - key: TEXT_MODEL
        value: "gemini-2.5-flash"
      - key: TTS_MODEL
        value: "gemini-2.5-flash-preview-tts"
      - key: ADMIN_PASSWORD
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
