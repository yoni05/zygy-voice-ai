services:
  - type: web
    name: zygy-voice-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install cors express
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1"
      - key: VOICE
        value: "Fenrir"
      - key: TURN_BUDGET_MS
        value: "120000"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: ADMIN_PASSWORD
        value: "1"
      - key: EXTENSIONS
        value: "[{\"p\":\"1\",\"m\":\"2\",\"v\":\"Fenrir\",\"g\":\"שלום\",\"x\":\"\"}]"
      - key: MAX_WORDS
        value: "261"
      - key: EXTRA_INSTRUCTION
        value: ""
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: YEMOT_TOKEN
        sync: false
