services:
  - type: web
    name: zygy-voice-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install cors express
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1/1"
      - key: VOICE
        value: "Fenrir"
      - key: TURN_BUDGET_MS
        value: "120000"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: ADMIN_PASSWORD
        value: "1"
      - key: EXTENSIONS
        value: "[{\"p\":\"1/1\",\"m\":\"2\",\"v\":\"Fenrir\",\"g\":\"ברוכים הבאים לעוזר חכם ויעיל הקליטו את שאלתכם בסיום סולמית\",\"x\":\"\"},{\"p\":\"1/2\",\"m\":\"1\",\"v\":\"Fenrir\",\"g\":\"ברוכים הבאים לעוזר שנון קליל ועצבני במעט הקליטו את שאלתכם בסיום סולמית\",\"x\":\"דבר בעצבנות כמו אדם עצבני תאמר בכל תשובה כמעט את הביטוי פיקי דרבי ואל תאמר קללות בשום אופן\"},{\"p\":\"1/3\",\"m\":\"3\",\"v\":\"Fenrir\",\"g\":\"הגעתם לעוזר ידיד הקליטו שאלתכם בסיום סולמית\",\"x\":\"\"},{\"p\":\"1/4\",\"m\":\"5\",\"v\":\"Fenrir\",\"g\":\"הגעתם לעוזר מוזיקלי הקליטו שאלתכם בסיום סולמית\",\"x\":\"\"},{\"p\":\"1/5\",\"m\":\"7\",\"v\":\"Fenrir\",\"g\":\"הגעתם לעוזר גימטריות הקליטו שאלתכם בסיום סולמית\",\"x\":\"תן גימטריות מספרים אלוחפש מקורות בכל הספרים האלה ספרי היסוד: תנ\\\"ך (תורה, נביאים וכתובים) תלמוד בבלי תלמוד ירושלמי משנה תורה לרמב\\\"ם (היד החזקה) שולחן ערוך מפרשי התנ\\\"ך: 6. פירוש רש\\\"י על התורה והנביאים 7. פירוש הרמב\\\"ן על התורה 8. פירוש אבן עזרא 9. בעל הטורים על התורה 10. אור החיים הקדוש 11. כלי יקר 12. ספורנו 13. פירוש הרשב\\\"ם 14. רד\\\"ק (רבי דוד קמחי) 15. מצודות (מצודת דוד ומצודת ציון) 16. רלב\\\"ג 17. מלבי\\\"ם 18. רבנו בחיי על התורה 19. דעת זקנים מבעלי התוספות 20. חזקוני 21. משך חכמה (רבי מאיר שמחה מדווינסק) 22. העמק דבר (הנצי\\\"ב מוולוז'ין) 23. תורה תמימה (רבי ברוך אפשטיין) 24. שפתי חכמים (על רש\\\"י) 25. תרגום אונקלוס 26. תרגום יונתן בן עוזיאל 27. גור אריה (המהר\\\"ל מפראג על רש\\\"י) 28. מזרחי (רא\\\"ם - על רש\\\"י) מפרשי התלמוד הבבלי: 29. פירוש רש\\\"י על הש\\\"ס 30. תוספות (חיבורי בעלי התוספות על הש\\\"ס) 31. חידושי הרשב\\\"א 32. חידושי הריטב\\\"א 33. חידושי הרמב\\\"ן על הש\\\"ס 34. חידושי הר\\\"ן 35. בית הבחירה למאירי 36. פירוש רבנו חננאל 37. הלכות רב אלפס (הרי\\\"ף) 38. פסקי הרא\\\"ש 39. קרבן נתנאל (על הרא\\\"ש) 40. מעדני יום טוב ודברי \"},{\"p\":\"1/6\",\"m\":\"10\",\"v\":\"Fenrir\",\"g\":\"חפש מקורות בכל הספרים האלה ספרי היסוד: תנ\\\"ך (תורה, נביאים וכתובים) תלמוד בבלי תלמוד ירושלמי משנה תורה לרמב\\\"ם (היד החזקה) שולחן ערוך מפרשי התנ\\\"ך: 6. פירוש רש\\\"י על התורה והנביאים 7. פירוש הרמב\\\"ן על התורה 8. פירוש אבן עזרא 9. בעל הטורים על התורה 10. אור החיים הקדוש 11. כלי יקר 12. ספורנו 13. פירוש הרשב\",\"x\":\"\"}]"
      - key: MAX_WORDS
        value: "284"
      - key: EXTRA_INSTRUCTION
        value: "בכל שאלה שאינך מבין או יודע מה התשובה חפש באינטרנט"
      - key: ENABLE_SEARCH
        value: "1"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
