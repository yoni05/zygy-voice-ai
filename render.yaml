services:
  - type: web
    name: zygy-voice-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install cors express
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "2/1"
      - key: VOICE
        value: "Fenrir"
      - key: TURN_BUDGET_MS
        value: "120000"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: ADMIN_PASSWORD
        value: "1"
      - key: EXTENSIONS
        value: "[{\"p\":\"2/1\",\"m\":\"2\",\"v\":\"Fenrir\",\"g\":\"שלום מדבר עוזר חכם ויעיל דבר ובסיום הקש סולמית\",\"x\":\"\"},{\"p\":\"2/2\",\"m\":\"1\",\"v\":\"Fenrir\",\"g\":\"שלום מדבר עוזר שנון וקליל דבר ובסיום הקש סולמית\",\"x\":\"\"},{\"p\":\"2/3\",\"m\":\"3\",\"v\":\"Fenrir\",\"g\":\"שלום מדבר עוזר ידיד קרוב דבר ובסיום הקש סולמית\",\"x\":\"\"},{\"p\":\"2/4\",\"m\":\"5\",\"v\":\"Fenrir\",\"g\":\"שלום מדבר עוזר מלחין דבר ובסיום הקש סולמית\",\"x\":\"\"},{\"p\":\"2/5\",\"m\":\"6\",\"v\":\"Fenrir\",\"g\":\"שלום מדבר עוזר מסכם דבר ובסיום הקש סולמית\",\"x\":\"\"},{\"p\":\"2/6\",\"m\":\"7\",\"v\":\"Fenrir\",\"g\":\"שלום מדבר עוזר גימטריות דבר ובסיום הקש סולמית\",\"x\":\"\"},{\"p\":\"2/7\",\"m\":\"10\",\"v\":\"Fenrir\",\"g\":\"שלום מדבר מאתר מראי מקומות חכם דבר ובסיום הקש סולמית\",\"x\":\"\"}]"
      - key: MAX_WORDS
        value: "199"
      - key: EXTRA_INSTRUCTION
        value: "א"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
